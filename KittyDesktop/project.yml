name: KittyDesktop
options:
  bundleIdPrefix: com.kitty
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_ENTITLEMENTS: Resources/KittyDesktop.entitlements

targets:
  KittyDesktop:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Resources/Assets.xcassets
        type: file
        buildPhase: resources
      - path: Resources/menubar_icon.png
        type: file
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: KittyDesktop
        CFBundleDisplayName: Kitty 桌面收纳
        CFBundleIdentifier: com.kitty.desktop
        CFBundleVersion: "15"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: KittyDesktop
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 Kitty. All rights reserved."
    entitlements:
      path: Resources/KittyDesktop.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/KittyDesktop.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.kitty.desktop
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
